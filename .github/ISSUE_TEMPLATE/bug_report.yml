name: Bug report
description: Report a reproducible defect in Dwarpal
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact PINs, passwords, recovery keys, selfies and database contents.
        For a security vulnerability, use the private advisory link instead of this form.

  - type: input
    id: version
    attributes:
      label: Dwarpal version
      description: Shown in Settings → Security, or the installer filename.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Installer (Program Files)
        - Portable ZIP
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the protected app, whether the machine was elevated, and the exact order.
      placeholder: |
        1. Add Notepad as a protected app
        2. Launch Notepad
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: From %ProgramData%\Dwarpal\logs, with secrets and personal paths removed.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am running the latest release and can reproduce this consistently.
          required: true
        - label: This is not a security vulnerability (those go through the private advisory link).
          required: true
