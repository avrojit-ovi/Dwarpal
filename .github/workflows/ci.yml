name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Dwarpal.sln

      - name: Build
        run: dotnet build Dwarpal.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Dwarpal.Core.Tests/Dwarpal.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
