<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dwarpal icon" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16295c"/><stop offset="1" stop-color="#070d26"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe3a0"/><stop offset="0.5" stop-color="#e0ab3c"/><stop offset="1" stop-color="#b57d16"/></linearGradient>
  <radialGradient id="aura" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#38e1ff" stop-opacity="0.35"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1.1" fill="#38e1ff" opacity="0.22"/></pattern>
  <clipPath id="shieldClip"><path d="M256 30 L440 92 V250 C440 366 356 448 256 490 C156 448 72 366 72 250 V92 Z"/></clipPath>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- outside circuit traces -->
<g stroke="#38e1ff" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
  <path d="M72 150 H38 V210 H22"/><path d="M72 280 H44 L28 296 V340"/><path d="M80 370 H52 V410"/>
  <path d="M440 150 H474 V210 H490"/><path d="M440 280 H468 L484 296 V340"/><path d="M432 370 H460 V410"/>
</g>
<g fill="#0a1230" stroke="#38e1ff" stroke-width="3">
  <circle cx="22" cy="210" r="6"/><circle cx="28" cy="340" r="6"/><circle cx="52" cy="410" r="6"/>
  <circle cx="490" cy="210" r="6"/><circle cx="484" cy="340" r="6"/><circle cx="460" cy="410" r="6"/>
</g>

<!-- shield -->
<path d="M256 30 L440 92 V250 C440 366 356 448 256 490 C156 448 72 366 72 250 V92 Z" fill="url(#navy)"/>
<g clip-path="url(#shieldClip)"><rect x="60" y="20" width="400" height="480" fill="url(#dots)"/><rect x="60" y="20" width="400" height="480" fill="url(#aura)"/></g>
<path d="M256 30 L440 92 V250 C440 366 356 448 256 490 C156 448 72 366 72 250 V92 Z" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
<path d="M256 54 L418 108 V248 C418 350 346 420 256 456 C166 420 94 350 94 248 V108 Z" fill="none" stroke="#38e1ff" stroke-width="1.8" opacity="0.45" stroke-dasharray="6 6"/>

<!-- trishul (guardian symbol) -->
<g fill="url(#gold)" stroke="url(#gold)" stroke-linejoin="round">
  <path d="M234 88 V100 C234 114 244 120 256 120 C268 120 278 114 278 100 V88" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 74 V128" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 56 L264 76 H248 Z"/><path d="M234 72 L241 90 H227 Z"/><path d="M278 72 L285 90 H271 Z"/>
</g>

<!-- gate / torana -->
<path d="M146 404 V240 A110 110 0 0 1 366 240 V404 Z" fill="#050a1d" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
<path d="M170 404 V244 A86 86 0 0 1 342 244 V404" fill="none" stroke="#38e1ff" stroke-width="2" opacity="0.5"/>
<rect x="130" y="404" width="252" height="16" rx="6" fill="url(#gold)"/>
<rect x="138" y="384" width="16" height="20" fill="url(#gold)"/><rect x="358" y="384" width="16" height="20" fill="url(#gold)"/>

<!-- circuit inside gate -->
<g stroke="#38e1ff" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)">
  <path d="M206 330 H184 V300 H168"/><path d="M206 350 H176 V372"/><path d="M306 330 H328 V300 H344"/><path d="M306 350 H336 V372"/>
</g>
<g fill="#050a1d" stroke="#38e1ff" stroke-width="2.5">
  <circle cx="166" cy="300" r="4.5"/><circle cx="176" cy="374" r="4.5"/><circle cx="346" cy="300" r="4.5"/><circle cx="336" cy="374" r="4.5"/>
</g>

<!-- padlock -->
<path d="M222 292 V262 A34 34 0 0 1 290 262 V292" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
<rect x="200" y="288" width="112" height="92" rx="16" fill="url(#gold)"/>
<circle cx="256" cy="325" r="13" fill="#050a1d"/>
<path d="M250 330 H262 L265 358 H247 Z" fill="#050a1d"/>
<circle cx="256" cy="325" r="5" fill="#38e1ff" filter="url(#glow)"/>
</svg>
